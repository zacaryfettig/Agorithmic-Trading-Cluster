trigger:
  branches:
    include:
      - main

stages:
- stage: DeployElastic
  displayName: "Deploy Elastic Stack to AKS"
  jobs:
  - job: Deploy
    displayName: "Deploy Kubernetes resources"
    pool:
      name: 'TradingContainerAgent'
    variables:
      AKS_RESOURCE_GROUP: "TradingInfra"
      AKS_CLUSTER_NAME: "TradingCluster"
      KUBE_NAMESPACE: "elastic"
      MANIFEST_FOLDER: "kubernetes"
      KEYVAULT_NAME: "TradingKeyVault"

    steps:
    - task: AzureCLI@2
      displayName: "Set up kubeconfig for AKS"
      inputs:
        azureSubscription: "Azure-Subscription-Trading"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials \
            --resource-group $(AKS_RESOURCE_GROUP) \
            --name $(AKS_CLUSTER_NAME) \
            --overwrite-existing

#    - script: |
#        set -e
#        HELM_VERSION=v3.19.4
#        curl -LO https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
#        tar -zxvf helm-${HELM_VERSION}-linux-amd64.tar.gz
#        mkdir -p $(Pipeline.Workspace)/bin
#        mv linux-amd64/helm $(Pipeline.Workspace)/bin/helm
#        chmod +x $(Pipeline.Workspace)/bin/helm
#        echo "##vso[task.prependpath]$(Pipeline.Workspace)/bin"
#      displayName: "Install Helm"

#    - script: |
#        helm version
#      displayName: "Verify Helm"


    - script: |
        helm repo add elastic https://helm.elastic.co
        helm repo update
        helm upgrade --install elastic-agent elastic/eck-operator -n $KUBE_NAMESPACE --create-namespace
      displayName: "Install Elastic Operator via Helm"

    - script: |
        kubectl apply -f $(MANIFEST_FOLDER)
      displayName: "Deploy all Kubernetes YAML manifests"

    - script: |
        set -e
        echo "Waiting for Kibana pod to be ready..."
        kubectl wait --for=condition=Ready pod -l app=kibana -n $KUBE_NAMESPACE --timeout=120s

        echo "Getting Elastic password"
        ELASTIC_PASSWORD=$(kubectl get secret elasticsearch-es-elastic-user \
          -n $(KUBE_NAMESPACE) \
          -o jsonpath="{.data.elastic}" | base64 --decode)

        echo "Getting Kibana external IP"
        KIBANA_IP=$(kubectl get svc kibana-kb-http \
          -n $(KUBE_NAMESPACE) \
          -o jsonpath="{.status.loadBalancer.ingress[0].ip}")

        KIBANA_URL="https://${KIBANA_IP}:5601"

        az keyvault secret set --vault-name $(KEKEYVAULT_NAME) --name "KibanaURL" --value "$KIBANA_URL"
        az keyvault secret set --vault-name $(KEKEYVAULT_NAME) --name "ElasticPassword" --value "$ELASTIC_PASSWORD"

        echo "Kibana URL: $KIBANA_URL"
      displayName: "Get Kibana URL and Elastic Password"