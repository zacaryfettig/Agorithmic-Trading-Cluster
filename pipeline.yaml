trigger:
  branches:
    include:
      - main

stages:
- stage: DeployElastic
  displayName: "Deploy Elastic Stack to AKS"
  jobs:
  - job: Deploy
    displayName: "Deploy Kubernetes resources"
    pool:
      name: 'TradingContainerAgent'
    variables:
      AKS_RESOURCE_GROUP: "TradingInfra"
      AKS_CLUSTER_NAME: "TradingCluster"
      KUBE_NAMESPACE: "elastic"
      MANIFEST_FOLDER: "kubernetes"
      KEYVAULT_NAME: "TradingKeyVault12"

    steps:
    - task: AzureCLI@2
      displayName: "Set up kubeconfig for AKS"
      inputs:
        azureSubscription: "Azure-Subscription-Trading"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az aks get-credentials \
            --resource-group $(AKS_RESOURCE_GROUP) \
            --name $(AKS_CLUSTER_NAME) \
            --overwrite-existing

    - script: |
        helm repo add elastic https://helm.elastic.co
        helm repo update
        helm upgrade --install elastic-agent elastic/eck-operator -n $KUBE_NAMESPACE --create-namespace
      displayName: "Install Elastic Operator via Helm"

    - script: |
        kubectl apply -f $(MANIFEST_FOLDER)
      displayName: "Deploy all Kubernetes YAML manifests"

    - task: AzureCLI@2
      displayName: "Get Kibana URL and Elastic Password"
      inputs:
        azureSubscription: "Azure-Subscription-Trading"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
            kubectl wait --for=condition=Ready pod -l kibana.k8s.elastic.co/name=kibana -n elastic --timeout=5m

            echo "Getting Elastic password"
            ELASTIC_PASSWORD=$(kubectl get secret elasticsearch-es-elastic-user \
              -n $(KUBE_NAMESPACE) \
              -o jsonpath="{.data.elastic}" | base64 --decode)

            echo "Getting Kibana external IP"
            KIBANA_IP=$(kubectl get svc kibana-kb-http \
              -n $(KUBE_NAMESPACE) \
              -o jsonpath="{.status.loadBalancer.ingress[0].ip}")

            KIBANA_URL="https://${KIBANA_IP}:5601"

            az keyvault secret set --vault-name $(KEYVAULT_NAME) --name "KibanaURL" --value "$KIBANA_URL"
            az keyvault secret set --vault-name $(KEYVAULT_NAME) --name "ElasticPassword" --value "$ELASTIC_PASSWORD"

            echo "Kibana URL: $KIBANA_URL"

    - task: AzureCLI@2
      displayName: "Create Fleet Server Policy with Kubernetes Integration"
      inputs:
        azureSubscription: "Azure-Subscription-Trading"
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          # Wait for Kibana pod to be ready
          kubectl wait --for=condition=Ready pod -l kibana.k8s.elastic.co/name=kibana -n $(KUBE_NAMESPACE) --timeout=5m

          # Get Elastic password (for API auth)
          ELASTIC_PASSWORD=$(kubectl get secret elasticsearch-es-elastic-user \
            -n $(KUBE_NAMESPACE) \
            -o jsonpath="{.data.elastic}" | base64 --decode)

          # Get Kibana URL (assuming ClusterIP for internal API access)
          KIBANA_URL="http://kibana-kb-http.$(KUBE_NAMESPACE).svc:5601"

          # Create Fleet Server policy via Kibana API
          POLICY_JSON=$(curl -s -X POST "$KIBANA_URL/api/fleet/agent_policies" \
            -H "kbn-xsrf: true" \
            -u "elastic:$ELASTIC_PASSWORD" \
            -H "Content-Type: application/json" \
            -d '{
                  "name": "ci-cd-fleet-server",
                  "namespace": "default",
                  "is_managed": false,
                  "description": "Fleet Server policy for CI/CD",
                  "monitoring_enabled": ["logs","metrics"]
                }')

          # Extract the policy ID
          POLICY_ID=$(echo "$POLICY_JSON" | jq -r '.item.id')
          echo "Fleet Server Policy ID: $POLICY_ID"
          
          # Patch the Fleet Server agent to associate with this policy
          kubectl patch agent fleetserver -n $(KUBE_NAMESPACE) --type=merge -p "{\"spec\":{\"policyID\":\"$POLICY_ID\"}}"
          echo "Fleet Server agent associated with policy $POLICY_ID"