---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: quickstart
  namespace: elastic
spec:
  version: 8.14.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      podTemplate:
        spec:
          volumes:
            - name: elasticsearch-data
              emptyDir: {}
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
            storageClassName: default
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: quickstart
  namespace: elastic
spec:
  version: 8.14.0
  count: 1

  elasticsearchRef:
    name: quickstart

  config:
    xpack.fleet.enabled: true

    xpack.fleet.agents.elasticsearch.hosts:
      - https://quickstart-es-http.elastic.svc:9200
---
apiVersion: agent.k8s.elastic.co/v1alpha1
kind: Agent
metadata:
  name: fleet-server
  namespace: elastic
spec:
  version: 8.14.0
  mode: fleet
  fleetServerEnabled: true
  elasticsearchRefs:
    - name: quickstart
      namespace: elastic
  kibanaRef:
    name: quickstart
    namespace: elastic
  deployment:
    replicas: 1
